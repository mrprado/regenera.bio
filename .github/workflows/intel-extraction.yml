name: Intelligence OS extraction

# Runs deterministic + Ollama-escalated extraction against queued
# intel_documents. Ollama has no persistent home in the Netlify serverless
# collector route, so this ephemeral runner is where LLM-escalated
# extraction actually happens in production -- free, per the spec's own
# free/open-source-first requirement (section 7).
#
# First two manual runs (2026-08-11) failed before reaching real work:
# run 1 hit a @/ path-alias resolution issue in persist.ts (fixed, tsx
# doesn't resolve Next.js's alias outside its build pipeline), run 2 hit
# "native WebSocket not found" from supabase-js's RealtimeClient on Node
# 20 (fixed above, needs 22+). Once a manual run (workflow_dispatch)
# actually succeeds end to end, uncomment the schedule below -- don't
# uncomment it preemptively just because the fixes look right on paper.

on:
  workflow_dispatch: {}
  # Uncomment once a manual run has been verified:
  # schedule:
  #   - cron: "0 6 * * *"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's RealtimeClient requires native
          # WebSocket support (Node 22+) at client construction time, even
          # though this script never uses realtime features -- confirmed
          # by an actual failed run on Node 20 ("native WebSocket not
          # found"), not a guess.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b

      - name: Run extraction
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLLAMA_MODEL: "llama3.2:1b"
        run: npx tsx scripts/intel-extract-ollama.ts
