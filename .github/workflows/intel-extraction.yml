name: Intelligence OS extraction

# Runs deterministic + Ollama-escalated extraction against queued
# intel_documents. Ollama has no persistent home in the Netlify serverless
# collector route, so this ephemeral runner is where LLM-escalated
# extraction actually happens in production -- free, per the spec's own
# free/open-source-first requirement (section 7).
#
# First four manual runs (2026-08-11) surfaced three real bugs before
# reaching real work: a @/ path-alias resolution issue in persist.ts (tsx
# doesn't resolve Next.js's alias outside its build pipeline), "native
# WebSocket not found" from supabase-js's RealtimeClient on Node 20 (needs
# 22+), and an unhandled crash on malformed LLM output (a small local
# model doesn't reliably follow the requested JSON shape). All three
# fixed and verified -- run 5 (2026-08-11) succeeded end to end, including
# a real Ollama-escalated extraction that wrote a genuine entity/evidence
# row to Supabase. Schedule enabled below on that basis.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "0 6 * * *"

jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # @supabase/supabase-js's RealtimeClient requires native
          # WebSocket support (Node 22+) at client construction time, even
          # though this script never uses realtime features -- confirmed
          # by an actual failed run on Node 20 ("native WebSocket not
          # found"), not a guess.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Install Ollama
        run: curl -fsSL https://ollama.com/install.sh | sh

      - name: Start Ollama and pull model
        run: |
          ollama serve &
          sleep 5
          ollama pull llama3.2:1b

      - name: Run extraction
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          OLLAMA_MODEL: "llama3.2:1b"
        run: npx tsx scripts/intel-extract-ollama.ts
