name: Intelligence OS collection

# Runs the collector (fetch, hash, store, change-detect) against every
# active intel_sources row, daily, before extraction runs. Without this,
# extraction and the digest only ever see the one-time bulk capture from
# when the registry was first built -- confirmed in production: a digest
# email reporting nothing new because no fresh document had been
# collected since the last one.
#
# Calls lib/intelligence/collect.ts directly against Supabase (same
# pattern as intel-extract-ollama.ts and intel-digest.ts), not the
# app/api/intel/collect HTTP route -- simpler, no INTEL_COLLECTOR_SECRET
# needed for the scheduled path. That route still exists for manual/
# on-demand single-source triggering later if useful.
#
# Scheduled 30 minutes before intel-extraction.yml's 06:00 UTC run so
# there's fresh material for it to work on.

on:
  workflow_dispatch: {}
  schedule:
    - cron: "30 5 * * *"

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          # Same Node 22 requirement as the other intel-* workflows --
          # @supabase/supabase-js's RealtimeClient needs native WebSocket
          # support at createClient() time.
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Run collection
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx tsx scripts/intel-collect.ts
